<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form id="main">
      <div class="form-section">
        <label for="name">NAME <span class="required-star">*</span></label>
        <input type="text" id="name" placeholder="Your full name" required />
      </div>

      <div class="form-section">
        <label for="contact"
          >CONTACT <span class="required-star">*</span></label
        >
        <input
          type="tel"
          id="contact"
          placeholder="Your mobile number"
          required
        />
      </div>

      <div class="form-section">
        <label for="address"
          >ADDRESS <span class="required-star">*</span></label
        >
        <textarea
          id="address"
          placeholder="Your full address"
          required
        ></textarea>
      </div>

      <div class="form-section">
        <label for="company"
          >COMPANY NAME <span class="required-star">*</span></label
        >
        <input type="text" id="company" placeholder="Company name" required />
      </div>

      <div class="form-section">
        <label for="email"
          >EMAIL ADDRESS <span class="required-star">*</span></label
        >
        <input type="email" id="email" placeholder="Your email" required />
      </div>

      <div class="form-section">
        <label for="department"
          >DEPARTMENT <span class="required-star">*</span></label
        >
        <select id="department" required>
          <option value="" disabled selected>Select department</option>
          <option value="HR">HR</option>
          <option value="SALES">SALES</option>
          <option value="DEVELOPMENT">DEVELOPMENT</option>
          <option value="MARKETING">MARKETING</option>
          <option value="OTHERS">OTHERS</option>
        </select>
      </div>

      <div class="form-section">
        <label>GENDER <span class="required-star">*</span></label>
        <div class="radio-group">
          <label class="radio-option">
            <input
              type="radio"
              name="gender"
              value="male"
              class="radio"
              required
            />
            <span>Male</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="gender" value="female" class="radio" />
            <span>Female</span>
          </label>
          <label class="radio-option">
            <input
              type="radio"
              name="gender"
              value="prefer-not-say"
              class="radio"
            />
            <span>Prefer not to say</span>
          </label>
        </div>
      </div>

      <div class="submit-container">
        <button type="submit" class="submit-btn">SUBMIT</button>
      </div>
    </form>
  </body>
</html>
